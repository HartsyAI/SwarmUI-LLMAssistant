name: E2E

# Unit tests plus the browser e2e suite (Playwright against a throwaway SwarmUI and a scripted mock LLM).
# See E2E/README.md. The local GGUF engine is not covered here (it needs a GPU).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The browser suite is split over three runners (Playwright shards it by spec file; each shard has its own throwaway
  # SwarmUI, so the specs of one shard never see another shard's server state). The unit tests run once, in shard 1.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out SwarmUI
        uses: actions/checkout@v4
        with:
          repository: mcmonkeyprojects/SwarmUI
          path: SwarmUI

      - name: Check out this extension into SwarmUI
        uses: actions/checkout@v4
        with:
          path: SwarmUI/src/Extensions/SwarmUI-LLMAssistant

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SwarmUI
        working-directory: SwarmUI
        run: dotnet build src/SwarmUI.csproj --configuration Release -o src/bin/live_release

      - name: Unit tests
        if: matrix.shard == 1
        working-directory: SwarmUI
        run: dotnet test src/Extensions/SwarmUI-LLMAssistant/Tests/LLMAssistant.Tests.csproj

      - name: Install e2e dependencies
        working-directory: SwarmUI/src/Extensions/SwarmUI-LLMAssistant/E2E
        run: |
          npm ci || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser e2e
        working-directory: SwarmUI/src/Extensions/SwarmUI-LLMAssistant/E2E
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            SwarmUI/src/Extensions/SwarmUI-LLMAssistant/E2E/playwright-report
            SwarmUI/src/Extensions/SwarmUI-LLMAssistant/E2E/test-results
            SwarmUI/src/Extensions/SwarmUI-LLMAssistant/E2E/.run/*.log

  # One required check name for the whole suite: passes only when every shard passed (a cancelled or skipped shard fails it).
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
